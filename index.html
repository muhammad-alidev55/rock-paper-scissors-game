<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="heading">
        <h1>Rock Paper Scissor Game</h1>
      </div>

      <div class="choices">
        <div id="Rock" class="box"></div>
        <div id="Paper" class="box"></div>
        <div id="Scissor" class="box"></div>
      </div>

      <div class="result">
        <div class="userScr">
          <p id="scoreyou">0</p>
          <p>User</p>
        </div>
        <div class="compScr">
          <p id="scorecomp">0</p>
          <p>Comp</p>
        </div>
      </div>
    </div>

    <div class="msg">
      <p>Result of the Match: ....</p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
